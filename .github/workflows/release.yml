# Builds, signs and publishes a release when a version tag is pushed:
#
#   git tag v2.3.1
#   git push origin v2.3.1
#
# The package gets a signed build provenance (Sigstore, through GitHub
# artifact attestations), so anyone can check that it was built here:
#
#   gh attestation verify copyable-pdf-2.3.1.vsix --repo Idris1980/copyable-pdf
#
# It is then published to the Visual Studio Marketplace with Trusted
# Publishing: GitHub proves to the Marketplace that this workflow in this
# repository is asking, and gets a credential that lasts 15 minutes. No
# token is stored anywhere. The publisher idris1980 has a Trusted
# Publishing policy for Idris1980/copyable-pdf and release.yml.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # sign with Sigstore, and sign in to the Marketplace
      attestations: write # store the signatures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check that the tag matches the extension version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Package the extension
        run: npx --yes @vscode/vsce@4.1.1 package

      - name: Sign the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "*.vsix"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          notes="Install it from the Visual Studio Marketplace (search for Markdown to Copyable PDF in VS Code), or with: code --install-extension copyable-pdf-$v.vsix
          The file is signed. Check it with: gh attestation verify copyable-pdf-$v.vsix --repo Idris1980/copyable-pdf"
          gh release create "$TAG" --verify-tag --title "Markdown to Copyable PDF $TAG" --notes "$notes" *.vsix

      - name: Publish to the Visual Studio Marketplace
        run: npx --yes @vscode/vsce@4.1.1 publish --oidc --packagePath *.vsix
